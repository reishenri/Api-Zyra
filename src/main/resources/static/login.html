<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - Zyra</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container">
  <div class="card">
    <h1>Zyra Systems</h1>
    <p class="subtitle">Login</p>

    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>

      <div class="field">
        <label>Senha</label>
        <input type="password" id="password" required>
      </div>

      <button type="submit">Entrar</button>
    </form>

    <p id="message" class="message"></p>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
