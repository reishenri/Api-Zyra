<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyra Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Zyra Systems</h1>
    <p class="subtitle">Monitoramento agrícola</p>

    <div class="cards">
        <div class="card">
            <h2>Temperatura</h2>
            <p id="temperature">-- °C</p>
        </div>

        <div class="card">
            <h2>Umidade do Ar</h2>
            <p id="airHumidity">-- %</p>
        </div>

        <div class="card">
            <h2>Umidade do Solo</h2>
            <p id="soilMoisture">-- %</p>
        </div>

        <div class="card">
            <h2>Alertas</h2>
            <p id="alert">--</p>
            <p>Ultima atualização: <span id="lastUpdate">--</span> </p>
        </div>
    </div>

    <div class="actions">
        <button onclick="loadLatestData()">Atualizar Dados</button>
    </div>

    <div class="history">
        <h2>Histórico de Leituras</h2>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Temperatura</th>
                <th>Umidade Ar</th>
                <th>Umidade Solo</th>
                <th>Data</th>
            </tr>
            </thead>
            <tbody id="historyTable"></tbody>
        </table>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
